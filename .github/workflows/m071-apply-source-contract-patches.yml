name: m071-apply-source-contract-patches

on:
  push:
    branches: [release/v0.7.1-structural-recovery]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.7.1-structural-recovery
          fetch-depth: 0
      - name: Apply exact source PR contract patches
        shell: bash
        run: |
          set -euo pipefail
          for p in .sync/003-charger-spec.patch .sync/004-vehicle-spec.patch .sync/005-domain-runtime-model.patch .sync/006-semantic-catalog.patch; do
            git apply --check "$p"
            git apply "$p"
          done
          rm -rf .sync
          rm .github/workflows/m071-apply-source-contract-patches.yml
      - name: Commit exact synchronized contracts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync exact M0.7.1 canonical contracts from source main"
          git push origin HEAD:release/v0.7.1-structural-recovery
